<div id="stage"><div id="panel"><h2>استوديو الإعلان — كل مشهد ورسمه</h2><div class="sub">اسحب الشريط أو اضغط أي مشهد. كل إطار يُرسم الحين بنفس الكود اللي طلّع الفيديو.</div><input id="tl" type="range" min="0" max="1537" value="0"><div class="row"><button id="pl">تشغيل</button><button class="alt" id="bk">-1 ث</button><button class="alt" id="fw">+1 ث</button><span id="tm"></span></div><div id="list"></div></div><div id="left"><canvas id="cv" width="1080" height="1920"></canvas></div></div>

<script>
const C=document.getElementById('cv'),X=C.getContext('2d');

const W=1080,H=1920;

let CAPS=[],VEND=0,OUTRO=0,DUR=0;
function init(d){

  if(FONT!=='Cairo'){const l=document.createElement('link');l.rel='stylesheet';
    l.href='https://fonts.googleapis.com/css2?family='+encodeURIComponent(FONT)+':wght@400;600;700;800;900&display=swap';
    document.head.appendChild(l);}

/* ---------- utils ---------- */
/* ألوان مشتقّة من الثيم — لا تكتب rgba ثابتة */
function hx(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');
  return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function rgba(hex,a){const c=hx(hex);return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';}
function lum(hex){const c=hx(hex).map(v=>{v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4);});
  return 0.2126*c[0]+0.7152*c[1]+0.0722*c[2];}

const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,k)=>a+(b-a)*k;
const ease=t=>1-Math.pow(1-t,3);

const back=t=>{const c=1.9,s=c+1;return 1+s*Math.pow(t-1,3)+c*Math.pow(t-1,2);};

function T(s,x,y,f,c,al,dir){X.save();X.font=f;X.fillStyle=c;X.textAlign=al||'center';X.textBaseline='middle';if(dir)X.direction=dir;X.fillText(s,x,y);X.restore();}
/* ---------- video staging ---------- */
const R_FULL={x:0,y:0,w:1080,h:1920,r:0};
const R_STAGE={x:190,y:660,w:700,h:700,r:44};
const R_SIDE={x:120,y:700,w:840,h:620,r:44};
const R_LOWER={x:350,y:1370,w:380,h:520,r:32};
const R_DOWN={x:214,y:760,w:652,h:1160,r:40};   /* الافتراضي للحظات الرسم: رسم فوق ← كابشن ← وجه تحت */
const SCENES=[
 {s:0.00,e:3.32,m:R_FULL},{s:3.32,e:8.00,m:R_DOWN},{s:8.00,e:11.45,m:R_FULL},
 {s:11.45,e:15.36,m:R_DOWN},{s:15.36,e:18.56,m:R_DOWN},{s:18.56,e:20.42,m:R_FULL},
 {s:20.42,e:25.76,m:R_FULL},{s:25.76,e:28.35,m:R_DOWN},{s:28.35,e:30.75,m:R_FULL},
 {s:30.75,e:34.90,m:R_DOWN},{s:34.90,e:38.38,m:R_DOWN},{s:38.38,e:39.76,m:R_FULL},

/* ---------- icons ---------- */

function iFile(x,y,s,c){X.save();X.strokeStyle=c;X.lineWidth=s*0.085;X.lineJoin='round';

  X.beginPath();X.moveTo(x+s*0.1,y-s*0.4);X.lineTo(x+s*0.1,y-s*0.2);X.lineTo(x+s*0.28,y-s*0.2);X.stroke();X.restore();}
function iCloud(x,y,s,c){X.save();X.fillStyle=c;
  X.beginPath();X.arc(x-0.23*s,y+0.03*s,0.20*s,0,7);X.fill();
  X.beginPath();X.arc(x+0.02*s,y-0.11*s,0.28*s,0,7);X.fill();
  X.beginPath();X.arc(x+0.27*s,y+0.05*s,0.17*s,0,7);X.fill();

function iCheck(x,y,s,c,k){X.save();X.strokeStyle=c;X.lineWidth=s*0.13;X.lineCap='round';X.lineJoin='round';
  const p=[[-0.32,0.02],[-0.08,0.26],[0.34,-0.26]];X.beginPath();X.moveTo(x+p[0][0]*s,y+p[0][1]*s);
  if(k<0.5){const q=k/0.5;X.lineTo(x+lerp(p[0][0],p[1][0],q)*s,y+lerp(p[0][1],p[1][1],q)*s);}
  else{X.lineTo(x+p[1][0]*s,y+p[1][1]*s);const q=(k-0.5)/0.5;X.lineTo(x+lerp(p[1][0],p[2][0],q)*s,y+lerp(p[1][1],p[2][1],q)*s);}
  X.stroke();X.restore();}
/* ---------- persistent chrome ---------- */
function badge(t){
  let a=pr(t,0.25,0.7); if(t>VEND-0.3)a*=1-pr(t,VEND-0.3,VEND);
  if(a<=0)return; X.save();X.globalAlpha=a;
  X.font='700 30px '+FONT;const s=HANDLE;
  const tw=X.measureText(s).width,lw=42,g=15,p=30,w=lw+g+tw+p*2,h=76,x=540-w/2,y=74;
  sh(26,10,0.16);X.fillStyle=cBG(0.94);rr(x,y,w,h,h/2);X.fill();nsh();
  X.strokeStyle=cINK(0.08);X.lineWidth=2;rr(x,y,w,h,h/2);X.stroke();
  X.drawImage(LOGO,x+w-p-lw,y+(h-lw)/2,lw,lw);
  X.fillStyle=INK;X.direction='ltr';X.textAlign='right';X.textBaseline='middle';X.fillText(s,x+w-p-lw-g,y+h/2+2);
  X.restore();}
function bar(t){let a=t>VEND-0.3?1-pr(t,VEND-0.3,VEND):1;if(a<=0)return;
  X.save();X.globalAlpha=a;const y=1878,h=7;
  X.fillStyle=cINK(0.13);rr(0,y,W,h,h/2);X.fill();
  X.fillStyle=ACC;rr(0,y,W*cl(t/VEND,0,1),h,h/2);X.fill();X.restore();}
/* ---------- captions ---------- */
const FS=55,LH=79,MAXW=830,GAP=16,PADX=44,PADY=30;
function layout(ws){X.font='800 '+FS+'px '+FONT;
  const it=ws.map(w=>({...w,w:X.measureText(w.t).width}));const L=[];let c=[],cw=0;
  for(const i of it){const add=c.length?i.w+GAP:i.w;
    if(cw+add>MAXW&&c.length){L.push({items:c,w:cw});c=[i];cw=i.w;}else{c.push(i);cw+=add;}}
  if(c.length)L.push({items:c,w:cw});return L;}
function caption(t){
  const c=CAPS.find(c=>t>=c.s&&t<c.e); if(!c)return;
  const lt=t-c.s,rt=c.e-t;let a=1,dy=0,sc=1;
  if(lt<0.2){const k=lt/0.2;a=ease(k);dy=(1-ease(k))*28;sc=0.93+0.07*back(k);}
  if(rt<0.13){const k=rt/0.13;a=k;dy=-(1-k)*10;}
  const L=layout(c.w),bh=L.length*LH+PADY*2,bw=Math.max(...L.map(l=>l.w))+PADX*2;
  const bx=540-bw/2,by=1580-bh;
  X.save();X.globalAlpha=a;X.translate(540,by+bh/2+dy);X.scale(sc,sc);X.translate(-540,-(by+bh/2));
  sh(48,20,0.30);X.fillStyle=cBG(0.96);rr(bx,by,bw,bh,38);X.fill();nsh();
  X.strokeStyle=cINK(0.09);X.lineWidth=2.5;rr(bx,by,bw,bh,38);X.stroke();
  X.font='800 '+FS+'px '+FONT;X.textAlign='right';X.textBaseline='middle';
  L.forEach((ln,li)=>{let x=540+ln.w/2;const cy=by+PADY+LH*li+LH/2;
    for(const i of ln.items){const act=t>=i.s&&t<i.e,sp=t>=i.s;let lift=0;
      if(act){const k=Math.min(1,(t-i.s)/0.1);lift=-5*Math.sin(k*Math.PI);}
      if(i.hot&&sp){const k=Math.min(1,(t-i.s)/0.16),gw=(i.w+28)*ease(k),gh=FS+21;
        X.fillStyle=ACC;rr(x+14-gw,cy-gh/2+lift,gw,gh,15);X.fill();X.fillStyle=onACC();}
      else X.fillStyle=act?ACC:INK;
      X.fillText(i.t,x,cy+2+lift);x-=i.w+GAP;}});
  X.restore();}
function wordsOf(i){return CAPS[i].w;}
window.__helpers={rr,sh,nsh,card,T,pr,ease,eio,back,lerp,cl};
/* ================= SCENE GRAPHICS ================= */
function stamp(t){ if(t<2.45||t>3.30)return;
  const k=pr(t,2.45,2.75), a=t>3.10?1-pr(t,3.10,3.30):1;
  X.save();X.globalAlpha=a;X.translate(540,300);X.rotate(-7*Math.PI/180);
  const sc=lerp(1.6,1,back(k));X.scale(sc,sc);
  const ar='مونتاج يدوي';
  X.font='900 58px '+FONT;const nw=X.measureText('0%').width;
  X.font='900 52px '+FONT;const aw=X.measureText(ar).width;
  const w=nw+26+aw+84,h=112;
  sh(40,16,0.26);X.fillStyle=ACC;rr(-w/2,-h/2,w,h,26);X.fill();nsh();
  T('0%',w/2-42-nw/2,4,'900 58px '+FONT,onACC(),'center','ltr');
  T(ar,-w/2+42+aw/2,4,'900 52px '+FONT,onACC());
  X.restore();
  const rk=pr(t,2.45,1.05); if(rk<1){X.save();X.globalAlpha=(1-rk)*0.45;X.strokeStyle=ACC;X.lineWidth=6;
    X.beginPath();X.arc(540,300,60+rk*300,0,7);X.stroke();X.restore();}
}
const CH=[{l:'الكابشن',i:iCaption},{l:'الزوم',i:iZoom},{l:'الكت',i:iCut},{l:'المؤثرات',i:iSpark}];
function chips(t){ if(t<3.30||t>8.00)return;
  const ws=wordsOf(1), pos=[[770,300],[310,300],[770,468],[310,468]];
  const flip=7.09, out=pr(t,7.80,8.00);
  for(let i=0;i<4;i++){

}
function fileToCloud(t){ if(t<8.9||t>11.45)return;

function transcript(t){ if(t<11.55||t>15.36)return;

document.getElementById('bk').onclick=()=>go(cur-FPS);
document.getElementById('fw').onclick=()=>go(cur+FPS);
document.getElementById('pl').onclick=function(){playing=!playing;this.textContent=playing?'إيقاف':'تشغيل';if(playing)loop();};
async function loop(){const t0=performance.now(),f0=cur;
  while(playing){const f=f0+Math.round((performance.now()-t0)/1000*FPS);
    if(f>+tl.max){playing=false;document.getElementById('pl').textContent='تشغيل';break;}
    await go(f); await new Promise(r=>setTimeout(r,0));}}
(async()=>{caps=await (await fetch('caps.json')).json();
  let th={}; try{th=await (await fetch('theme.json')).json();}catch(e){}
  window.init({cards:caps.cards,total:caps.total,outro:OUT_D,theme:th});
  tl.max=Math.round((caps.total+OUT_D)*FPS)-1;
  await document.fonts.ready; await new Promise(r=>{const l=document.getElementById('LOGO');l.complete?r():l.onload=r;});
  go(Math.round(4.6*FPS));})();
</script></body></html>
