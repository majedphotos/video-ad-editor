let CAPS=[],TOTAL=0;const IM={};

const NZ=document.createElement('canvas');NZ.width=NZ.height=512;{const g=NZ.getContext('2d');const im=g.createImageData(512,512);for(let i=0;i<im.data.length;i+=4){const v=200+Math.random()*55;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=Math.random()<0.55?28:0;}g.putImageData(im,0,0);}
